name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Python tests
        run: coverage run -m unittest tests.test_ha_codex_core

      - name: Python coverage report
        run: |
          coverage xml -o coverage-python.xml
          coverage report -m

      - name: Upload Python coverage
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage-python.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend tests
        run: node --test tests/frontend/*.test.mjs

      - name: Frontend coverage report
        run: |
          node --test \
            --experimental-test-coverage \
            --test-coverage-include='frontend/src/**/*.ts' \
            --test-coverage-include='frontend/src/**/*.tsx' \
            --test-reporter=lcov \
            --test-reporter-destination=coverage-frontend.lcov \
            tests/frontend/*.test.mjs

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage-frontend.lcov
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Verify packaged panel exists
        run: test -s custom_components/ha_codex/frontend/panel.js
