name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build packaged panel
        run: npm run build --prefix frontend

      - name: Set manifest version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/ha_codex/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          tag = os.environ["RELEASE_VERSION"]
          data["version"] = tag[1:] if tag.startswith("v") else tag
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}

      - name: Create zipped release package
        run: |
          cd custom_components/ha_codex
          zip -r ../../ha_codex.zip .
          cd ../..
          test -s ha_codex.zip
          unzip -l ha_codex.zip manifest.json frontend/panel.js bridge/ha_codex_bridge.py brand/icon.png

      - name: Upload release package
        uses: softprops/action-gh-release@v2
        with:
          files: ha_codex.zip
