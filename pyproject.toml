[tool.ruff]
target-version = "py311"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["custom_components.ha_codex"]

[tool.coverage.report]
fail_under = 90
show_missing = true
